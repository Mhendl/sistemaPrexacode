# Sitio de nginx para Prexacode (servidor compartido con otras aplicaciones).
# Copiar a /etc/nginx/sites-available/, enlazar en sites-enabled y sacar el certificado con:
#   certbot --nginx -d sistema.prexacode.com
server {
    listen 80;
    server_name sistema.prexacode.com;

    # Logos y archivos importados (Excel) de hasta 15 MB
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
