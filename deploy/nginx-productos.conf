# Landing de los productos (Prexacode y CoreDental): página estática.
# Copiar a /etc/nginx/sites-available/, enlazar en sites-enabled, copiar landing/ a /var/www/productos y sacar el certificado con:
#   certbot --nginx -d productos.prexacode.com
server {
    listen 80;
    server_name productos.prexacode.com;
    root /var/www/productos;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
