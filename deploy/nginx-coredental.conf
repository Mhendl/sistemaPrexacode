# coredental.prexacode.com: la dirección vieja de CoreDental. Ahora CoreDental vive en app.coredental.com.ar
# (ver nginx-app-coredental.conf): esta redirige ahí conservando la ruta, así los links ya enviados
# (turnos, reservas, bajas de campañas) siguen funcionando.
server {
    server_name coredental.prexacode.com;

    location / {
        return 301 https://app.coredental.com.ar$request_uri;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/coredental.prexacode.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/coredental.prexacode.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name coredental.prexacode.com;
    return 301 https://app.coredental.com.ar$request_uri;
}
