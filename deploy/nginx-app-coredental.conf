# CoreDental en su dominio propio: app.coredental.com.ar (detrás de Cloudflare, con su certificado de origen).
# Es el mismo sistema que sistema.prexacode.com (contenedor en 127.0.0.1:8010), con la marca de CoreDental.
# Reemplaza a /etc/nginx/sites-enabled/coredental-app (la versión vieja, respaldada en /root/backups).
server {
    listen 80;
    listen 443 ssl;
    server_name app.coredental.com.ar;

    ssl_certificate /etc/ssl/cloudflare/coredental.crt;
    ssl_certificate_key /etc/ssl/cloudflare/coredental.key;

    # Logos, radiografías y archivos importados de hasta 15 MB
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
